name: Host Makan

on:
  workflow_dispatch:
  schedule:
    # هر ۵ ساعت یک‌بار ری‌استارت تا لینک زنده بماند
    - cron: "0 */5 * * *"

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install and build
        run: npm run setup

      - name: Start server
        env:
          NODE_ENV: production
          HOST: 0.0.0.0
          PORT: "8080"
          GROQ_DISABLED: "true"
          OLLAMA_DISABLED: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          nohup node server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8080/api/health" >/dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 2
          done
          echo "server failed to start"
          tail -n 100 server.log || true
          exit 1

      - name: Public tunnel and keep alive
        run: |
          set -e
          npx --yes localtunnel --port 8080 > tunnel.log 2>&1 &
          LT_PID=$!

          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.loca\.lt' tunnel.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            if ! kill -0 "$LT_PID" 2>/dev/null; then
              echo "localtunnel exited early"
              cat tunnel.log || true
              exit 1
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "tunnel URL not found"
            cat tunnel.log || true
            exit 1
          fi

          echo "PUBLIC_URL=$URL"
          echo "$URL" > LIVE_URL.txt
          echo "## ماکان آنلاین" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "لینک مستقیم: $URL" >> "$GITHUB_STEP_SUMMARY"

          git config user.name "makan-bot"
          git config user.email "makan-bot@users.noreply.github.com"
          git add LIVE_URL.txt
          git commit -m "Update live URL" || true
          git push origin HEAD:live-url --force || true

          while kill -0 "$LT_PID" 2>/dev/null; do
            sleep 60
          done
          echo "tunnel process ended"
          cat tunnel.log || true
          exit 1
