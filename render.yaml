services:
  - type: web
    name: makan
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run setup
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_DISABLED
        value: "true"
      - key: OLLAMA_DISABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HOST
        value: "0.0.0.0"
